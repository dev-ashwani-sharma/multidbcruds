# ============================================
# APPLICATION CONFIGURATION
# ============================================
spring.application.name=multi-database-crud
server.port=8080

# ============================================
# MYSQL DATABASE CONFIGURATION
# ============================================
# MySQL Connection
spring.datasource.url=jdbc:mysql://localhost:3306/crud_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-test-query=SELECT 1

# JPA/Hibernate Configuration
spring.jpa.database=MYSQL
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

# JPA Show SQL (set to false in production)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# Hibernate Batch Operations
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ============================================
# MONGODB CONFIGURATION
# ============================================
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=crud_db
#spring.data.mongodb.authentication-database=crud_db
#spring.data.mongodb.username=
#spring.data.mongodb.password=
# Alternative: Use URI format
# spring.data.mongodb.uri=mongodb://localhost:27017/crud_db

spring.data.mongodb.auto-index-creation=true
spring.data.mongodb.repositories.enabled=true

# ============================================
# ELASTICSEARCH CONFIGURATION
# ============================================
spring.data.elasticsearch.cluster-name=elasticsearch
spring.data.elasticsearch.cluster-nodes=localhost:9200
spring.data.elasticsearch.repositories.enabled=true

# Alternative for Elasticsearch 7.x+
# spring.elasticsearch.uris=http://localhost:9200
# spring.elasticsearch.socket-timeout=30s
# spring.elasticsearch.connection-timeout=5s

# ============================================
# CACHE CONFIGURATION
# ============================================
# Cache type (caffeine, redis, none)
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterAccess=3600s

# Redis Cache (Optional - uncomment if using Redis)
# spring.cache.type=redis
# spring.data.redis.host=localhost
# spring.data.redis.port=6379
# spring.data.redis.password=
# spring.data.redis.timeout=5000ms

# ============================================
# LOGGING CONFIGURATION
# ============================================
# Logging Levels
logging.level.com.learning.dbcrud=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.elasticsearch.client=DEBUG
logging.level.org.mongodb.driver=DEBUG

# Log File Configuration
logging.file.name=logs/application.log
logging.file.max-size=10MB
logging.file.max-history=30
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ============================================
# ACTUATOR / MONITORING CONFIGURATION
# ============================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoints.web.exposure.exclude=env,configprops
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always

# Health Indicators
management.health.db.enabled=true
management.health.defaults.enabled=true
management.health.elasticsearch.enabled=true
management.health.mongo.enabled=true

# Metrics
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}

# ============================================
# OPENAPI / SWAGGER CONFIGURATION
# ============================================
springdoc.api-docs.path=/api-docs
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.display-request-duration=true
springdoc.show-actuator=true

# ============================================
# APPLICATION SPECIFIC CONFIGURATIONS
# ============================================
# Database Configuration
app.database.default=mysql
app.database.allowed-types=mysql,elasticsearch,mongodb

# Pagination
app.pagination.default-page-size=20
app.pagination.max-page-size=100

# Bulk Operations
app.bulk.batch-size=1000

# Retry Configuration
app.retry.max-attempts=3
app.retry.backoff-delay=1000

# ============================================
# SECURITY CONFIGURATION (Optional)
# ============================================
# Basic Authentication (uncomment if needed)
# security.basic.enabled=true
# security.basic.user.name=admin
# security.basic.user.password=admin123

# CORS Configuration (if using frontend)
# cors.allowed-origins=http://localhost:3000
# cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
# cors.allowed-headers=*
# cors.allow-credentials=true

# ============================================
# PERFORMANCE TUNING
# ============================================
# Server Configuration
server.tomcat.connection-timeout=20000
server.tomcat.max-connections=10000
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10
server.tomcat.accept-count=100

# Compression
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain

# ============================================
# DEVELOPMENT TOOLS (Optional)
# ============================================
# DevTools
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
spring.devtools.remote.restart.enabled=false

# ============================================
# DATASOURCE CONNECTION POOL
# ============================================
# HikariCP Detailed Settings
spring.datasource.hikari.pool-name=HikariPool
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.register-mbeans=true

# ============================================
# JPA ADDITIONAL SETTINGS
# ============================================
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.properties.hibernate.connection.autocommit=false
spring.jpa.properties.hibernate.id.new_generator_mappings=true

# ============================================
# ELASTICSEARCH ADDITIONAL SETTINGS
# ============================================
# For Elasticsearch High Level Client
elasticsearch.socket-timeout=30000
elasticsearch.connection-timeout=5000
elasticsearch.max-retry-timeout=60000

# ============================================
# MONGODB ADDITIONAL SETTINGS
# ============================================
spring.data.mongodb.socket-connect-timeout=5000
spring.data.mongodb.socket-read-timeout=5000